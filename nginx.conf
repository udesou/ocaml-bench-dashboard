# Observable pages link to /curves, /sweep, ... but the files are curves.html
# etc.; try_files below maps one to the other.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
