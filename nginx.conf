# nginx site config for the static dashboard.
#
# Observable Framework builds "clean URLs": pages link to /curves, /sweep, … but
# the files on disk are curves.html, sweep.html, …. Without the try_files rule
# below, nginx would 404 on those links and only the landing page would work.
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
        # serve the exact file, else <name>.html, else a directory index.
        try_files $uri $uri.html $uri/ =404;
    }
}
